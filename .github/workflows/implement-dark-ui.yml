name: Implement Dark UI
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Wire Dark UI routing
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          p=Path('src/main.jsx'); s=p.read_text(); original=s
          # Design Library: accept a Dark UI opener and expose it in the route map.
          if 'onDarkUIDesign' not in s:
              old='function DesignLibrary({ onBack, onMinimalism, onGlassmorphism, onNeumorphism, onBrutalism, onSkeuomorphism, onClaymorphism, onMaximalism, onMaterialDesign, onFlatDesign, onAuroraGradient }) {'
              new='function DesignLibrary({ onBack, onMinimalism, onGlassmorphism, onNeumorphism, onBrutalism, onSkeuomorphism, onClaymorphism, onMaximalism, onMaterialDesign, onFlatDesign, onAuroraGradient, onDarkUIDesign }) {'
              if old not in s: raise SystemExit('DesignLibrary signature not found')
              s=s.replace(old,new,1)
          if 'darkuidesign: onDarkUIDesign' not in s:
              old='auroragradient: onAuroraGradient };'
              new='auroragradient: onAuroraGradient, darkuidesign: onDarkUIDesign };'
              if old not in s: raise SystemExit('DesignLibrary opener map not found')
              s=s.replace(old,new,1)
          # App hash routing: add Dark UI after Aurora in both initial state and hashchange handler.
          marker='window.location.hash === "#auroragradient" ? "auroragradient" : "home"'
          if s.count(marker) != 2: raise SystemExit(f'Expected 2 Aurora hash routes, found {s.count(marker)}')
          s=s.replace(marker,'window.location.hash === "#auroragradient" ? "auroragradient" : window.location.hash === "#darkuidesign" ? "darkuidesign" : "home"',2)
          # Library opener prop.
          old='onFlatDesign={() => go("flatdesign")} onAuroraGradient={() => go("auroragradient")} />;'
          new='onFlatDesign={() => go("flatdesign")} onAuroraGradient={() => go("auroragradient")} onDarkUIDesign={() => go("darkuidesign")} />;'
          if old not in s: raise SystemExit('DesignLibrary App prop tail not found')
          s=s.replace(old,new,1)
          # Render the new page after Aurora.
          old='if (view === "auroragradient") return <Suspense fallback={<StyleLoader />}><AuroraGradient onBack={() => go("library")} /></Suspense>;'
          new=old+' if (view === "darkuidesign") return <Suspense fallback={<StyleLoader />}><DarkUIDesign onBack={() => go("library")} /></Suspense>;'
          if old not in s: raise SystemExit('Aurora render branch not found')
          s=s.replace(old,new,1)
          p.write_text(s)
          PY
      - name: Commit and remove temporary workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/implement-dark-ui.yml
          git add src/main.jsx
          git commit -m 'Wire Dark UI style page and library entry'
          git push
