name: Fix Flat Design Preview

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    if: ${{ !contains(github.event.head_commit.message, '[flat-preview-fixed]') }}
    steps:
      - uses: actions/checkout@v4
      - name: Add dedicated Flat Design preview
        shell: python
        run: |
          from pathlib import Path
          p = Path('src/main.jsx')
          text = p.read_text()
          text = text.replace('route: "flatdesign", preview: 0', 'route: "flatdesign", preview: 8')
          marker = '  if (index === 7) return <div className="preview material-preview"><div className="material-mini-bar"><span>✦</span><b>Material</b><small>EARTH SYSTEM</small></div><div className="material-mini-content"><span>02.02</span><strong>Make it<br/><em>meaningful.</em></strong><small>DEPTH · MOTION · COLOUR</small><button>EXPLORE →</button></div><i className="material-mini-fab">+</i><div className="material-mini-nav"><span>HOME</span><span>LAYOUT</span><span>COMPONENTS</span></div></div>;\n'
          flat = '  if (index === 8) return <div className="preview flat-preview"><div className="flat-preview-top"><b>FLAT / 02.01</b><i></i><i></i><i></i></div><div className="flat-preview-body"><span>01</span><strong>Clear<br/><b>by design.</b></strong><small>COLOUR · TYPE · SHAPE</small><div><i></i><i></i><i></i></div></div></div>;\n'
          if flat not in text:
              if marker not in text:
                  raise SystemExit('Material preview marker not found')
              text = text.replace(marker, marker + flat)
          p.write_text(text)

          css = Path('src/library.css')
          extra = '\n.flat-preview{background:#f7f8fa!important;color:#172033!important;border:1px solid #d8dee8!important;overflow:hidden;position:relative}.flat-preview .flat-preview-top{height:42px;border-bottom:1px solid #d8dee8;display:flex;align-items:center;padding:0 14px;gap:7px;font-size:8px;font-weight:900;letter-spacing:.1em;background:#fff}.flat-preview .flat-preview-top i{width:9px;height:9px;border-radius:50%;background:#dce2ea;margin-left:auto}.flat-preview .flat-preview-top i+i{margin-left:0;background:#3157ff}.flat-preview .flat-preview-top i+i+i{background:#3157ff}.flat-preview .flat-preview-body{position:relative;height:calc(100% - 42px);padding:18px 22px;background:#fff}.flat-preview .flat-preview-body>span{position:absolute;left:22px;top:18px;background:#3157ff;color:#fff;border-radius:3px;padding:7px 9px;font-size:10px;font-weight:900}.flat-preview .flat-preview-body>strong{position:absolute;left:22px;top:66px;font-size:clamp(28px,4vw,44px);line-height:.95;letter-spacing:-.06em}.flat-preview .flat-preview-body>strong b{background:#172033;color:#fff;padding:0 4px}.flat-preview .flat-preview-body>small{position:absolute;left:22px;bottom:12px;font-size:8px;font-weight:900;letter-spacing:.1em;color:#5b6574}.flat-preview .flat-preview-body>div{position:absolute;right:18px;bottom:15px;display:flex;gap:6px}.flat-preview .flat-preview-body>div i{width:30px;height:30px;background:#3157ff}.flat-preview .flat-preview-body>div i:nth-child(2){background:#ff6254}.flat-preview .flat-preview-body>div i:nth-child(3){background:#ffd44d}\n'
          if '.flat-preview{' not in css.read_text():
              css.write_text(css.read_text() + extra)
      - name: Validate build
        run: |
          npm install
          npm run build
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/main.jsx src/library.css
          git diff --cached --quiet && exit 0
          git commit -m "Add dedicated Flat Design preview [flat-preview-fixed]"
          git push
