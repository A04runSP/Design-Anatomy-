name: Apply Design Anatomy lazy loader

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  apply:
    if: ${{ !contains(github.event.head_commit.message, '[skip ci]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Apply lazy loading
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('src/main.jsx')
          s = p.read_text()
          s = s.replace('import React, { useEffect, useMemo, useState } from "react";', 'import React, { lazy, Suspense, useEffect, useMemo, useState } from "react";', 1)
          for name in ['Minimalism','Glassmorphism','Neumorphism','Brutalism','Skeuomorphism','Claymorphism','Maximalism','MaterialDesign','FlatDesign','AuroraGradient']:
              s = s.replace(f'import {name} from "./{name}.jsx";', f'const {name} = lazy(() => import("./{name}.jsx"));', 1)
          s = s.replace('import "./heading-overrides.css";', 'import "./heading-overrides.css";\nimport "./style-loader.css";', 1)
          marker = 'function StyleCard({ style, onOpen }) {'
          loader = '''function StyleLoader() {\n  return <div className="style-loader" role="status" aria-live="polite">\n    <div className="style-loader-mark">✦</div>\n    <div className="style-loader-name">DESIGN ANATOMY</div>\n    <div className="style-loader-line"><span></span></div>\n    <div className="style-loader-status">LOADING STYLE</div>\n  </div>;\n}\n\n'''
          if 'function StyleLoader()' not in s:
              s = s.replace(marker, loader + marker, 1)
          old = '''if (view === "minimalism") return <Minimalism onBack={() => go("library")} />; if (view === "glassmorphism") return <Glassmorphism onBack={() => go("library")} />; if (view === "neumorphism") return <Neumorphism onBack={() => go("library")} />; if (view === "brutalism") return <Brutalism onBack={() => go("library")} />; if (view === "skeuomorphism") return <Skeuomorphism onBack={() => go("library")} />; if (view === "claymorphism") return <Claymorphism onBack={() => go("library")} />; if (view === "maximalism") return <Maximalism onBack={() => go("library")} />; if (view === "flatdesign") return <FlatDesign onBack={() => go("library")} />; if (view === "materialdesign") return <MaterialDesign onBack={() => go("library")} />; if (view === "auroragradient") return <AuroraGradient onBack={() => go("library")} />;'''
          new = '''if (view === "minimalism") return <Suspense fallback={<StyleLoader />}><Minimalism onBack={() => go("library")} /></Suspense>; if (view === "glassmorphism") return <Suspense fallback={<StyleLoader />}><Glassmorphism onBack={() => go("library")} /></Suspense>; if (view === "neumorphism") return <Suspense fallback={<StyleLoader />}><Neumorphism onBack={() => go("library")} /></Suspense>; if (view === "brutalism") return <Suspense fallback={<StyleLoader />}><Brutalism onBack={() => go("library")} /></Suspense>; if (view === "skeuomorphism") return <Suspense fallback={<StyleLoader />}><Skeuomorphism onBack={() => go("library")} /></Suspense>; if (view === "claymorphism") return <Suspense fallback={<StyleLoader />}><Claymorphism onBack={() => go("library")} /></Suspense>; if (view === "maximalism") return <Suspense fallback={<StyleLoader />}><Maximalism onBack={() => go("library")} /></Suspense>; if (view === "flatdesign") return <Suspense fallback={<StyleLoader />}><FlatDesign onBack={() => go("library")} /></Suspense>; if (view === "materialdesign") return <Suspense fallback={<StyleLoader />}><MaterialDesign onBack={() => go("library")} /></Suspense>; if (view === "auroragradient") return <Suspense fallback={<StyleLoader />}><AuroraGradient onBack={() => go("library")} /></Suspense>;'''
          if old not in s:
              raise SystemExit('route block not found')
          s = s.replace(old, new, 1)
          p.write_text(s)
          PY

      - name: Add loader stylesheet
        run: |
          cat > src/style-loader.css <<'CSS'
          .style-loader{min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;background:#061113;color:#f4ffff;gap:14px;text-align:center}.style-loader-mark{font-size:28px;line-height:1;animation:style-loader-pulse 1.4s ease-in-out infinite}.style-loader-name{font-size:11px;letter-spacing:.24em;font-weight:700}.style-loader-line{width:150px;height:2px;background:rgba(244,255,255,.12);overflow:hidden}.style-loader-line span{display:block;width:45%;height:100%;background:#16e1ef;animation:style-loader-slide 1.1s ease-in-out infinite}.style-loader-status{font-size:9px;letter-spacing:.2em;opacity:.55}@keyframes style-loader-pulse{0%,100%{transform:scale(.9);opacity:.55}50%{transform:scale(1);opacity:1}}@keyframes style-loader-slide{0%{transform:translateX(-110%)}100%{transform:translateX(330%)}}
          CSS

      - name: Commit and remove temporary workflow
        run: |
          rm -f .github/workflows/apply-lazy-loader.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/main.jsx src/style-loader.css .github/workflows/apply-lazy-loader.yml
          git commit -m "Add lazy loading for style pages [skip ci]"
          git push origin HEAD:main
