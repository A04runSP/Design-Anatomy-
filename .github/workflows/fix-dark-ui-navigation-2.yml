name: Fix Dark UI navigation 2
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch style button fallback
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          p = Path('src/main.jsx')
          s = p.read_text()
          old = '<button className="library-style-action" onClick={onOpen}>'
          new = '<button type="button" className="library-style-action" onClick={onOpen || (() => { window.location.hash = style.route; window.scrollTo(0,0); })}>'
          if old not in s:
              raise SystemExit('style button marker not found')
          p.write_text(s.replace(old, new, 1))
          PY
      - name: Commit and remove temporary workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/fix-dark-ui-navigation-2.yml
          git add src/main.jsx
          git commit -m 'Make style card navigation robust'
          git push
