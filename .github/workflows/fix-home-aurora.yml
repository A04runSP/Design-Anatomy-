name: Fix home Aurora rotation

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Restore Aurora to homepage rotation
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          p = Path('src/main.jsx')
          s = p.read_text()
          old = 'const homeStyles = styles.filter(style => style.route !== "auroragradient");'
          new = 'const homeStyles = styles;'
          if old in s:
              if s.count(old) != 1:
                  raise SystemExit('Expected exactly one homepage Aurora filter; refusing to modify anything.')
              p.write_text(s.replace(old, new, 1))
          elif 'const homeStyles = styles;' not in s:
              raise SystemExit('Neither the blocked nor fixed homepage rotation was found; refusing to modify anything.')
          PY

      - name: Commit fix and remove temporary workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/main.jsx
          git rm .github/workflows/fix-home-aurora.yml
          git commit -m 'Fix Aurora gradient homepage preview'
          git push
