<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#020708" />
    <title>Design Anatomy — Style Library</title>
    <style>
      :root { color-scheme: dark; font-family: Inter, system-ui, sans-serif; }
      * { box-sizing: border-box; }
      body { margin: 0; min-height: 100vh; background: #020708; color: #f4ffff; padding: 32px; }
      .library { width: min(760px, 100%); margin: 0 auto; border: 1px solid rgba(72, 226, 240, .28); border-radius: 24px; padding: 48px; background: rgba(7, 24, 27, .72); box-shadow: 0 0 40px rgba(40, 220, 235, .08); }
      .number { color: #16e1ef; letter-spacing: .16em; font-size: 15px; font-weight: 800; }
      .eyebrow { margin-top: 28px; color: #63e8f4; letter-spacing: .16em; font-size: 13px; font-weight: 800; }
      h1 { margin: 14px 0 26px; font-size: clamp(36px, 7vw, 68px); line-height: .98; letter-spacing: -.04em; }
      h1 span { color: #16e1ef; }
      .intro { color: rgba(244,255,255,.72); line-height: 1.75; font-size: 18px; max-width: 620px; }
      .intro strong { color: #f4ffff; }
      .prompt { margin-top: 20px; color: rgba(244,255,255,.78); line-height: 1.7; font-size: 17px; }
      button { margin-top: 28px; border: 1px solid rgba(99,232,244,.45); border-radius: 999px; background: rgba(99,232,244,.08); color: #f4ffff; padding: 12px 18px; cursor: pointer; font: inherit; font-weight: 700; letter-spacing: .08em; }
      button:hover { box-shadow: 0 0 22px rgba(99,232,244,.18); }
      @media (max-width: 600px) { body { padding: 18px; } .library { padding: 34px 28px; border-radius: 22px; } .intro { font-size: 17px; } }
    </style>
  </head>
  <body>
    <main class="library">
      <div class="number">01</div>
      <div class="eyebrow">DESIGN LIBRARY</div>
      <h1>Explore <span>Styles.</span></h1>
      <p class="intro"><strong>Design styles are visual languages.</strong> Explore how different choices of colour, shape, spacing, light, material, typography, and depth create a distinct visual character.</p>
      <p class="prompt"><strong>Choose a style. Look closely. Understand what makes it work.</strong></p>
      <button onclick="window.location.href='/'">← BACK TO DASHBOARD</button>
    </main>
  </body>
</html>
