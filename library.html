<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#020708" />
    <title>Design Anatomy — Style Library</title>
    <style>
      :root { color-scheme: dark; font-family: Inter, system-ui, sans-serif; }
      * { box-sizing: border-box; }
      body { margin: 0; min-height: 100vh; background: #020708; color: #f4ffff; display: grid; place-items: center; padding: 32px; }
      .library { width: min(760px, 100%); border: 1px solid rgba(72, 226, 240, .28); border-radius: 24px; padding: 48px; background: rgba(7, 24, 27, .72); box-shadow: 0 0 40px rgba(40, 220, 235, .08); }
      .eyebrow { color: #63e8f4; letter-spacing: .16em; font-size: 12px; font-weight: 700; }
      h1 { margin: 14px 0; font-size: clamp(36px, 7vw, 68px); line-height: .98; }
      p { color: rgba(244,255,255,.68); line-height: 1.7; max-width: 620px; }
      button { margin-top: 24px; border: 1px solid rgba(99,232,244,.45); border-radius: 999px; background: rgba(99,232,244,.08); color: #f4ffff; padding: 12px 18px; cursor: pointer; }
      button:hover { box-shadow: 0 0 22px rgba(99,232,244,.18); }
    </style>
  </head>
  <body>
    <main class="library">
      <div class="eyebrow">01 · DESIGN LIBRARY</div>
      <h1>Explore Styles</h1>
      <p>The library is now a separate destination. Style content will be added here next.</p>
      <button onclick="window.location.href='/'">← BACK TO DASHBOARD</button>
    </main>
  </body>
</html>
