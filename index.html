<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#020708" />
    <meta name="description" content="Design Anatomy — learn to see the language of interface design." />
    <title>Design Anatomy — Learn to see the language</title>
    <link rel="stylesheet" href="/src/heading-overrides.css" />
  </head>
  <body>
    <div id="root"></div>
    <script>
      // Direct page navigation for Design Library styles.
      // This intentionally bypasses the React click handlers for the style detail page.
      document.addEventListener("click", function (event) {
        const button = event.target.closest(".library-style-action");
        if (!button) return;
        event.preventDefault();
        event.stopImmediatePropagation();
        const card = button.closest(".library-style-card");
        const number = card?.querySelector(".library-style-top span")?.textContent?.trim();
        if (number === "01") {
          window.location.assign("/minimalism.html");
        }
      }, true);

      // Compatibility guard: older navigation may still request /library.html.
      // Keep the route inside the React application instead of requiring a page file.
      if (window.location.pathname === "/library.html") {
        window.location.replace("/#library");
      }
    </script>
    <script type="module" src="/src/navigation.js"></script>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
